# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run test:assets

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Verify package versions match the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const sdk=require("./package.json"); const assets=require("./packages/osrs-sdk-assets/package.json"); if(sdk.version !== assets.version || process.env.RELEASE_TAG !== sdk.version) throw new Error("Release tag and package versions must match");'
      - run: npm publish --provenance
      - run: npm publish --workspace osrs-sdk-assets --provenance --access public
